<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casino Welcome Bonuses</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5b6672; --line:#e2e6ea; --accent:#0b57d0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121417; --card:#1b1f24; --ink:#eef1f4; --muted:#9aa5b1; --line:#2b323a; --accent:#7aa7ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; }
  .meta { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .card h2 { font-size:1.1rem; margin:0 0 8px; }
  .bonus { font-weight:600; margin:0 0 12px; }
  dl { display:grid; grid-template-columns: auto 1fr; gap:6px 16px; margin:0 0 12px; }
  dt { color:var(--muted); }
  dd { margin:0; text-align:right; font-variant-numeric: tabular-nums; }
  a { color:var(--accent); }
  .src { font-size:.85rem; }
  .note { color:var(--muted); font-size:.8rem; margin-top:20px; }
  .err { color:#b3261e; }
  /* Table layout on wider screens */
  @media (min-width: 640px) { .bonus { font-size:1.05rem; } }
</style>
</head>
<body>
<main>
  <h1>Casino welcome bonuses</h1>
  <p class="meta" id="meta">Loading…</p>
  <div id="list" aria-live="polite"></div>
  <p class="note">18+. Gamble responsibly (BeGambleAware.org). Data is scraped automatically and may be out of date; always check the casino's own terms.</p>
</main>
<script>
  const list = document.getElementById('list');
  const meta = document.getElementById('meta');

  function el(tag, text, cls) {
    const n = document.createElement(tag);
    if (text !== undefined) n.textContent = text;
    if (cls) n.className = cls;
    return n;
  }

  function wagering(v) {
    if (v === null || v === undefined) return 'Not stated';
    return v === 0 ? 'None' : v + 'x';
  }

  fetch('bonuses.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      const when = new Date(data.scraped_at);
      meta.textContent = 'Updated ' + when.toLocaleString() + ' · Source: ';
      const s = el('a', new URL(data.source).hostname);
      s.href = data.source; s.rel = 'noopener';
      meta.appendChild(s);

      data.casinos.forEach(c => {
        const card = el('section', undefined, 'card');
        card.appendChild(el('h2', c.casino));
        card.appendChild(el('p', c.welcome_bonus, 'bonus'));

        const dl = el('dl');
        [['Wagering requirement', wagering(c.wagering_multiplier)],
         ['Minimum deposit', c.minimum_deposit || 'Not stated']].forEach(([k, v]) => {
          dl.appendChild(el('dt', k));
          dl.appendChild(el('dd', v));
        });
        card.appendChild(dl);

        const p = el('p', undefined, 'src');
        const a = el('a', 'Source page');
        a.href = c.source_url; a.rel = 'noopener';
        p.appendChild(a);
        card.appendChild(p);
        list.appendChild(card);
      });
    })
    .catch(err => {
      meta.textContent = '';
      list.appendChild(el('p', 'Could not load bonuses.json (' + err.message + '). Run scrape.py first.', 'err'));
    });
</script>
</body>
</html>
